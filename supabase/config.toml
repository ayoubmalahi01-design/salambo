project_id = "the-trainers"

# Browser-facing functions: the caller must present a signed-in user's JWT.
[functions.invite-user]
verify_jwt = true

[functions.verify-otp]
verify_jwt = true

# Internal delivery functions. They are called only by invite-user with the
# x-internal-secret header (OTP_DELIVERY_SECRET); they never accept a browser
# origin and never return the OTP or the recipient number.
[functions.send-whatsapp]
verify_jwt = false

[functions.send-sms]
verify_jwt = false
